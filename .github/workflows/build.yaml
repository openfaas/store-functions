name: build

on:
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - '*'

jobs:
  build:
    concurrency: 
      group: ${{ github.ref }}
      cancel-in-progress: true

    permissions:
      packages: write
      checks: write
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@master
        with:
          fetch-depth: 1
      - name: Get faas-cli
        run: curl -sLSf https://cli.openfaas.com | sudo sh
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Get Repo Owner
        id: get_repo_owner
        run: echo "REPO_OWNER=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')" > $GITHUB_ENV

      - name: Pull templates
        run: |
          faas-cli template store pull node25
          faas-cli template store pull dockerfile
          faas-cli template store pull golang-middleware

      - name: Build multi-arch functions
        run: >
          OWNER="${{ env.REPO_OWNER  }}" 
          TAG="latest"
          SERVER="ghcr.io"
          faas-cli build
          -f stack.yml

      - name: Build amd64-only functions
        run: >
          OWNER="${{ env.REPO_OWNER  }}" 
          TAG="latest"
          SERVER="ghcr.io"
          faas-cli build
          -f stack-amd64.yml

